<?xml version="1.0" encoding="UTF-8"?>
<!--
  Crushfilms favicon.
  Mirrors the nav mark: red circle with a black inner, exactly the
  4px-ring proportion used at the 28px nav size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <!-- red outer disc -->
  <circle cx="16" cy="16" r="14" fill="#ff3b1f"/>
  <!-- black inner — produces the donut/ring read -->
  <circle cx="16" cy="16" r="10" fill="#0a0a0a"/>
</svg>
