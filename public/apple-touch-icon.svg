<?xml version="1.0" encoding="UTF-8"?>
<!--
  Apple touch icon — same mark, but on a black rounded-square plate so it
  has presence on a home-screen / bookmark surface where Safari composites
  icons against arbitrary backgrounds.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" shape-rendering="geometricPrecision">
  <!-- rounded-square black plate -->
  <rect width="180" height="180" rx="36" fill="#0a0a0a"/>
  <!-- red outer disc -->
  <circle cx="90" cy="90" r="60" fill="#ff3b1f"/>
  <!-- black inner -->
  <circle cx="90" cy="90" r="44" fill="#0a0a0a"/>
</svg>
